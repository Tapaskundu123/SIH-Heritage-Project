name: CI — Lint & Test

# ---------------------------------------------------------------
# Runs on every push to main/develop and on pull requests to main
# ---------------------------------------------------------------
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # =============================================================
  # Job 1: Backend — ESLint + TypeScript build check
  # =============================================================
  lint-and-test-backend:
    name: "Backend — ESLint + TypeScript"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: Backend/dist
          retention-days: 1

  # =============================================================
  # Job 2: Frontend (Next.js) — ESLint + build
  # =============================================================
  lint-and-test-frontend:
    name: "Frontend — ESLint + Next.js Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/my-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true  # Don't block CI on lint warnings

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build (validates standalone output)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_AI_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"

  # =============================================================
  # Job 3: Mobile App — ESLint + TypeScript type-check
  # =============================================================
  lint-and-test-mobile:
    name: "Mobile App — Expo Lint + Type-check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/mobile-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit
        continue-on-error: true

  # =============================================================
  # Job 4: AI Service — Python lint + pytest
  # =============================================================
  lint-and-test-ai:
    name: "AI Service — Python Lint + Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: AI/requirements.txt

      - name: Install minimal test dependencies
        run: |
          pip install --upgrade pip
          # Install only lightweight deps needed for linting/unit tests
          # (skip heavy torch/CUDA wheels in CI for speed)
          pip install fastapi uvicorn pydantic python-dotenv loguru httpx \
                      pytest pytest-asyncio httpx

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short -x
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  # =============================================================
  # Job 5: Docker Compose validation (config + build check)
  # =============================================================
  validate-compose:
    name: "Docker Compose — Config Validation"
    runs-on: ubuntu-latest
    needs: [lint-and-test-backend, lint-and-test-ai, lint-and-test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: |
          cat > .env.compose << 'EOF'
          GITHUB_REPOSITORY_OWNER=ci-test
          IMAGE_TAG=ci
          MONGODB_URI=mongodb://localhost:27017/test
          JWT_SECRET=ci_test_secret_not_real
          JWT_EXPIRES_IN=7d
          NEXT_PUBLIC_API_URL=http://localhost:5000
          NEXT_PUBLIC_AI_URL=http://localhost:8000
          CORS_ORIGIN=http://localhost:3000
          HF_TOKEN=hf_test
          WHISPER_MODEL=tiny
          UPLOAD_DIR=uploads
          MAX_FILE_SIZE=10485760
          EOF
          docker compose --env-file .env.compose config --quiet
